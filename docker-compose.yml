services:
  pipeline:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data
    command: azurite-blob --blobHost 0.0.0.0

volumes:
  azurite_data:
